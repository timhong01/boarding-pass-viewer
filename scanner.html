<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登機證掃描器</title>
<link rel="stylesheet" href="seatmap.css">
<style>
  :root{
    --tk:#c8102e;
    --ink:#222;
    --muted:#888;
    --line:#eee;
    --ok:#2e7d32;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;background:#eee;}
  body{
    font-family:-apple-system,"PingFang TC","Noto Sans TC",Arial,sans-serif;
    color:var(--ink);
    padding:20px 12px 40px;
    display:flex;justify-content:center;
  }
  .wrap{width:100%;max-width:440px;}
  .card{
    background:#fff;border-radius:20px;
    box-shadow:0 4px 24px rgba(0,0,0,.08);
    padding:18px 16px 22px;margin-bottom:16px;
  }
  h1{color:var(--tk);font-size:19px;margin:0 0 2px;text-align:center;}
  .sub{color:var(--muted);font-size:12px;text-align:center;margin:0 0 14px;}
  .privacy{
    display:flex;gap:8px;align-items:flex-start;
    background:#f4faf4;border:1px solid #c9e6ca;border-radius:10px;
    padding:9px 11px;font-size:11.5px;line-height:1.6;color:#3a5a3c;margin-bottom:14px;
  }
  .privacy b{color:var(--ok);}
  .tabs{display:flex;gap:6px;margin-bottom:12px;}
  .tab{
    flex:1;text-align:center;font-size:13px;font-weight:600;
    padding:8px 0;border-radius:10px;border:1.5px solid var(--line);
    background:#fafafa;color:#555;cursor:pointer;
  }
  .tab.active{border-color:var(--tk);color:var(--tk);background:#fffaf9;}
  .panel{display:none;}
  .panel.active{display:block;}

  #video{width:100%;border-radius:12px;background:#000;display:block;aspect-ratio:4/3;object-fit:cover;}
  .cam-controls{display:flex;gap:8px;margin-top:10px;}
  button{
    font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
    border:none;border-radius:10px;padding:10px 14px;
  }
  .btn-primary{background:var(--tk);color:#fff;flex:1;}
  .btn-ghost{background:#f0f0f0;color:#444;}
  button:disabled{opacity:.5;cursor:not-allowed;}
  .status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;min-height:16px;}
  .status.err{color:var(--tk);}

  textarea{
    width:100%;min-height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:12px;border:1.5px solid var(--line);border-radius:10px;padding:10px;resize:vertical;
  }
  .hint{font-size:11px;color:var(--muted);margin:6px 0 10px;line-height:1.6;}

  /* 解析結果 */
  #result{display:none;}
  .pax{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:10px;margin-bottom:10px;border-bottom:1px dashed var(--line);
  }
  .pax .name{font-size:16px;font-weight:700;}
  .pax .etkt{font-size:10px;color:#fff;background:var(--ok);padding:2px 8px;border-radius:20px;}
  .leg{
    border:1.5px solid var(--tk);border-radius:12px;padding:12px;margin-bottom:12px;background:#fffaf9;
  }
  .leg .route{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;color:var(--tk);}
  .leg .route .arrow{color:#bbb;font-size:16px;}
  .leg .flight{font-size:12px;color:#666;margin:2px 0 10px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
  .grid>div{display:flex;flex-direction:column;align-items:center;text-align:center;}
  .g-label{color:var(--muted);font-size:9.5px;}
  .g-value{color:var(--ink);font-weight:700;font-size:14px;}
  .g-value.seat{color:var(--tk);}
  .meta{margin-top:9px;padding-top:8px;border-top:1px dashed #eecccc;font-size:11px;color:#777;line-height:1.7;}
  .meta .warn{color:#b06a00;}
  .parse-err{background:#fff5f5;border:1.5px solid var(--tk);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--tk);}

  .actype-row{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .actype-row label{font-size:11.5px;color:var(--muted);flex-shrink:0;}
  select.actype{
    flex:1;font-family:inherit;font-size:12.5px;color:var(--ink);
    border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;
  }
  .seatmap-note{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.6;}
  .seatmap-mount{margin-top:10px;}
  .seatmap-mount .fuselage{margin-top:0;}
  .no-seat-hint{font-size:11px;color:var(--muted);margin-top:8px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h1>登機證掃描器</h1>
    <p class="sub">掃描或貼上登機證條碼 · IATA BCBP</p>

    <div class="privacy">
      <span>🔒</span>
      <span><b>資料只留在你的裝置</b>。條碼含完整姓名與訂位代號（等同帳號密碼），本頁全程在瀏覽器本機解析，<b>不會上傳任何伺服器</b>。</span>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="cam">📷 相機掃描</div>
      <div class="tab" data-tab="manual">⌨️ 手動貼上</div>
    </div>

    <!-- 相機 -->
    <div class="panel active" id="panel-cam">
      <video id="video" playsinline muted></video>
      <div class="cam-controls">
        <button class="btn-primary" id="startBtn">開始掃描</button>
        <button class="btn-ghost" id="stopBtn" disabled>停止</button>
      </div>
      <div class="status" id="camStatus"></div>
    </div>

    <!-- 手動 -->
    <div class="panel" id="panel-manual">
      <p class="hint">把登機證條碼解碼後的原始字串貼進來（通常以 <code>M1</code> 或 <code>M2</code> 開頭）。相機掃不到時可用其他 App 解碼再貼上。</p>
      <textarea id="manualInput" placeholder="M1DESMARAIS/LUC       EABC123 YULFRAAC 0834 226F001A0025 100"></textarea>
      <div class="cam-controls">
        <button class="btn-primary" id="parseBtn">解析</button>
        <button class="btn-ghost" id="sampleBtn">填入範例</button>
      </div>
      <div class="status err" id="manualStatus"></div>
    </div>
  </div>

  <!-- 結果 -->
  <div class="card" id="result"></div>

</div>

<script src="bcbp.js"></script>
<script src="seatmap.js"></script>
<script>
(function(){
  "use strict";

  // ---- 分頁切換 ----
  var tabs = document.querySelectorAll('.tab');
  tabs.forEach(function(t){
    t.addEventListener('click', function(){
      tabs.forEach(function(x){ x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('panel-cam').classList.toggle('active', t.dataset.tab==='cam');
      document.getElementById('panel-manual').classList.toggle('active', t.dataset.tab==='manual');
      if (t.dataset.tab !== 'cam') stopCamera();
    });
  });

  // ---- 手動解析 ----
  var manualInput = document.getElementById('manualInput');
  document.getElementById('parseBtn').addEventListener('click', function(){
    var v = manualInput.value.trim();
    var st = document.getElementById('manualStatus');
    st.textContent = '';
    if (!v) { st.textContent = '請先貼上條碼字串'; return; }
    try { render(BCBP.parse(v)); }
    catch(e){ st.textContent = e.message || '解析失敗'; renderError(e.message); }
  });
  document.getElementById('sampleBtn').addEventListener('click', function(){
    manualInput.value = 'M1DESMARAIS/LUC       EABC123 YULFRAAC 0834 226F001A0025 100';
    document.getElementById('manualStatus').textContent = '';
  });

  // ---- 相機掃描（原生 BarcodeDetector）----
  var video = document.getElementById('video');
  var startBtn = document.getElementById('startBtn');
  var stopBtn = document.getElementById('stopBtn');
  var camStatus = document.getElementById('camStatus');
  var stream = null, detector = null, rafId = null;

  var supported = ('BarcodeDetector' in window);
  if (!supported){
    startBtn.disabled = true;
    setStatus(camStatus, '此瀏覽器不支援原生條碼偵測（BarcodeDetector）。請改用「手動貼上」，或用支援的瀏覽器（如 Android Chrome）。', true);
  }

  startBtn.addEventListener('click', startCamera);
  stopBtn.addEventListener('click', function(){ stopCamera(); setStatus(camStatus,'已停止'); });

  async function startCamera(){
    setStatus(camStatus,'啟動相機中…');
    try{
      var formats = ['pdf417','aztec','qr_code','data_matrix'];
      try {
        var avail = await window.BarcodeDetector.getSupportedFormats();
        formats = formats.filter(function(f){ return avail.indexOf(f) !== -1; });
        if (!formats.length) formats = ['qr_code'];
      } catch(_) {}
      detector = new window.BarcodeDetector({ formats: formats });

      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' }, audio: false
      });
      video.srcObject = stream;
      await video.play();
      startBtn.disabled = true; stopBtn.disabled = false;
      setStatus(camStatus,'對準登機證條碼…（支援 '+formats.join(' / ')+'）');
      scanLoop();
    } catch(e){
      setStatus(camStatus, '無法開啟相機：'+(e.message||e), true);
      stopCamera();
    }
  }

  async function scanLoop(){
    if (!detector || !stream) return;
    try{
      var codes = await detector.detect(video);
      if (codes && codes.length){
        var raw = codes[0].rawValue || '';
        try{
          var parsed = BCBP.parse(raw);
          stopCamera();
          setStatus(camStatus,'✓ 掃描成功');
          render(parsed);
          return;
        }catch(_){ /* 非 BCBP 條碼，繼續掃 */ }
      }
    }catch(e){ /* 忽略單幀錯誤，持續掃 */ }
    rafId = requestAnimationFrame(scanLoop);
  }

  function stopCamera(){
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    video.srcObject = null;
    startBtn.disabled = !supported; stopBtn.disabled = true;
  }

  function setStatus(el,msg,isErr){
    el.textContent = msg; el.classList.toggle('err', !!isErr);
  }

  // ---- 渲染結果 ----
  var result = document.getElementById('result');

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function actypeOptionsHtml(){
    return '<option value="">—— 選擇機型以顯示座位圖 ——</option>' +
      SeatMap.types().map(function(t){
        return '<option value="'+esc(t)+'">'+esc(SeatMap.label(t))+'</option>';
      }).join('');
  }

  function render(data){
    var legsHtml = data.legs.map(function(l, i){
      var d = l.dateOfFlight;
      var dateStr = d ? d.formatted : '(儒略日 '+esc(l.julian)+')';
      var yearWarn = (d && d.yearAssumed) ? ' <span class="warn">（年份為推算，條碼未含年份）</span>' : '';
      var meta = [];
      meta.push('訂位代號 <b>'+esc(l.pnr||'—')+'</b>');
      if (l.sequence) meta.push('登機序號 '+esc(l.sequence));
      if (l.paxStatusName) meta.push('狀態：'+esc(l.paxStatusName));
      if (l.conditional && l.conditional.frequentFlyer) meta.push('常客號 '+esc(l.conditional.frequentFlyer));

      var hasSeat = l.seat && l.seat.row && l.seat.column;
      var seatPicker = hasSeat
        ? '<div class="actype-row">'+
            '<label for="actype-'+i+'">機型</label>'+
            '<select class="actype" id="actype-'+i+'" data-leg="'+i+'">'+actypeOptionsHtml()+'</select>'+
          '</div>'+
          '<div class="seatmap-note">條碼不含機型資訊，手動選擇後會依機型通用範本畫出座位圖（非航空公司精確座位圖），僅在本機繪製。</div>'+
          '<div class="seatmap-mount" id="seatmap-'+i+'"></div>'
        : '<div class="no-seat-hint">座位格式「'+esc(l.seat.display||'—')+'」無法對應到行列座位，不顯示座位圖。</div>';

      return ''+
      '<div class="leg">'+
        '<div class="route"><span>'+esc(l.from||'???')+'</span><span class="arrow">✈</span><span>'+esc(l.to||'???')+'</span></div>'+
        '<div class="flight">'+esc(l.carrier)+' '+esc(l.flightNumber)+' · '+dateStr+yearWarn+'</div>'+
        '<div class="grid">'+
          '<div><span class="g-label">艙等</span><span class="g-value">'+esc(l.compartment)+'</span></div>'+
          '<div><span class="g-label">艙別</span><span class="g-value">'+esc(l.compartmentName||'—')+'</span></div>'+
          '<div><span class="g-label">座位</span><span class="g-value seat">'+esc(l.seat.display||'—')+'</span></div>'+
          '<div><span class="g-label">日期</span><span class="g-value">'+(d?esc(String(d.day)):'—')+'</span></div>'+
        '</div>'+
        '<div class="meta">'+meta.join(' · ')+'</div>'+
        seatPicker+
      '</div>';
    }).join('');

    result.innerHTML =
      '<div class="pax">'+
        '<span class="name">'+esc(data.passengerName||'（無姓名）')+'</span>'+
        (data.electronicTicket ? '<span class="etkt">電子機票</span>' : '')+
      '</div>'+
      '<div class="sub" style="text-align:left;margin:0 0 12px">共 '+data.legCount+' 個航段</div>'+
      legsHtml;
    result.style.display = 'block';
    result.scrollIntoView({behavior:'smooth', block:'nearest'});

    result.querySelectorAll('select.actype').forEach(function(sel){
      sel.addEventListener('change', function(){
        var i = parseInt(sel.dataset.leg, 10);
        var leg = data.legs[i];
        var mount = document.getElementById('seatmap-'+i);
        mount.innerHTML = '';
        if (!sel.value) return;
        var you = { row: parseInt(leg.seat.row, 10), col: leg.seat.column };
        mount.appendChild(SeatMap.render({ type: sel.value, you: you }));
      });
    });
  }

  function renderError(msg){
    result.innerHTML = '<div class="parse-err">⚠️ '+esc(msg||'解析失敗')+'<br><span style="color:#999;font-weight:400">請確認貼上的是登機證條碼原始字串（BCBP，通常以 M 開頭）。</span></div>';
    result.style.display = 'block';
  }
})();
</script>
</body>
</html>
